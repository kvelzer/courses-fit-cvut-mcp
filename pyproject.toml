[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-courses-mcp"
version = "0.1.0"
description = "Read FIT CTU course materials from local MCP clients"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0", "httpx==0.28.1", "beautifulsoup4==4.15.0",
  "markdownify==1.2.3", "pypdf==7.1.0", "playwright==1.65.2",
  "python-dotenv==1.2.4", "pydantic>=2.11,<3",
]

[project.scripts]
fit-courses-mcp = "fit_courses.server:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
